<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ren2Leaf</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="app.css">
    <script type="module" src="app.js"></script>
</head>
<body>
    <div class="shell">
        <aside class="sidebar" data-tip-side="right">
            <div class="brand">
                <span class="brand-name">Ren2Leaf</span>
                <button type="button" class="sidebar-toggle" id="sidebar-toggle"></button>
            </div>
            <div class="switcher" id="switcher"></div>
            <div class="nav-label">迁移步骤</div>
            <nav class="nav" id="steps" aria-label="步骤"></nav>
            <div class="sidebar-foot" id="statusbar"></div>
        </aside>

        <main class="workspace" id="workspace">
            <header class="topbar" id="workspace-head" hidden>
                <div class="crumbs">
                    <span class="crumb" id="game-title"></span>
                    <span class="crumb-sep" aria-hidden="true">/</span>
                    <span class="crumb is-current" id="step-title"></span>
                </div>
                <div class="topbar-meta" id="topbar-meta"></div>
            </header>
            <section class="step-host" id="step-host"></section>
        </main>
    </div>
</body>
</html>
